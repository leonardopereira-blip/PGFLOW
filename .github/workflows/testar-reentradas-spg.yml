name: Validar gerador XLSX de reentradas
on:
  push:
    branches: [main]
    paths:
      - ValidaReentradasSPG.js
      - ValidaInterface.html
      - EmailSPG.js
      - LegadoAlocacaoReentradas.js
      - ReentradasFormaCerta.js
      - ReentradasRecentes.js
      - ReentradasEspecificacaoGeral.js
      - ReentradasMacro.js
      - MacroProtecao*.js
      - ProtecaoLogprint.js
      - SPG.js
      - Ajusta_API.js
      - MoldeXlsx.js
      - Molde*.js
      - tools/**
      - tests/reentradas-*.test.cjs
      - tests/molde*.test.cjs
      - tests/spg-espec-normalizacao.test.cjs
      - tests/macro-protecao.test.cjs
      - .github/workflows/testar-reentradas-spg.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-concurrency=1 tests/reentradas-*.test.cjs tests/molde*.test.cjs tests/spg-espec-normalizacao.test.cjs tests/macro-protecao.test.cjs
