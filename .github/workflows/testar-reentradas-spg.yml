name: Validar gerador XLSX de reentradas
on:
  push:
    branches: [main]
    paths:
      - ValidaReentradasSPG.js
      - ValidaInterface.html
      - tests/reentradas-spg.test.cjs
      - .github/workflows/testar-reentradas-spg.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/reentradas-spg.test.cjs
