name: Validar normalizacao de especificacoes SPG
on:
  push:
    branches: [main]
    paths:
      - SPG.js
      - tests/spg-espec-normalizacao.test.cjs
      - .github/workflows/testar-spg-espec.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar dimensoes, referencias e booleanos
        run: node --test tests/spg-espec-normalizacao.test.cjs
